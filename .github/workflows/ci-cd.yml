name: GitFlow DevOps Pipeline - Multi-Env

# Flujo:
#   feature/**  -> despliega en TEST (us-east-2)
#   develop     -> despliega en TEST (us-east-2)
#   release/**  -> despliega en TEST y abre solo el PR hacia master
#   master      -> despliega en PROD (us-east-1), crea el tag + Release y
#                  sincroniza develop hacia atrás
#
# El tag lo genera el job "release" al final de un despliegue exitoso a PROD,
# por eso no se dispara con push de tags: sería un ciclo.
#
# Un PR creado con GITHUB_TOKEN no dispara los checks de pull_request (GitHub
# lo bloquea para evitar recursión). Por eso la validación de una release
# ocurre en el push a la rama release/**, no en el PR que este pipeline abre.
on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # JOB 1: Análisis de Calidad
  # ----------------------------------------------------
  sonarcloud_quality_gate:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # En master el scan es bloqueante; en feature/develop solo informa.
    continue-on-error: ${{ github.ref != 'refs/heads/master' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=lvasqvera
            -Dsonar.projectKey=lvasqvera_proyecto-devops-lambda
            -Dsonar.sources=backend/,frontend/

  # ----------------------------------------------------
  # JOB 2: Despliegue en TEST (us-east-2)
  # ----------------------------------------------------
  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: sonarcloud_quality_gate
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || startsWith(github.ref, 'refs/heads/release/')
    # Varias ramas feature comparten el mismo ambiente y el mismo lock de estado.
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (TEST)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TEST }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Seleccionar workspace TEST
        working-directory: ./terraform
        run: terraform workspace select -or-create test

      # El sed reemplaza TODA ocurrencia: una segunda dentro de una comparación
      # la dejaría apuntando contra sí misma y rompería el frontend en silencio.
      - name: Validar que el placeholder sea único
        run: |
          OCURRENCIAS=$(grep -o "URL_API_PLACEHOLDER" frontend/index.html | wc -l)
          if [ "$OCURRENCIAS" -ne 1 ]; then
            echo "::error::Se esperaba 1 ocurrencia de URL_API_PLACEHOLDER y hay ${OCURRENCIAS}"
            exit 1
          fi
          echo "Placeholder único: la inyección es segura"

      # Si el ambiente ya existe, la URL se conoce antes de aplicar y basta un
      # solo apply. Solo el primer despliegue necesita aplicar dos veces.
      - name: Inyectar URL de la API (ambiente ya existente)
        id: pre_inject
        working-directory: ./terraform
        run: |
          if API_URL=$(terraform output -raw api_url 2>/dev/null) && [ -n "$API_URL" ]; then
            sed -i "s|URL_API_PLACEHOLDER|${API_URL}|g" ../frontend/index.html
            echo "inyectada=si" >> "$GITHUB_OUTPUT"
            echo "URL conocida, inyectada antes del apply: $API_URL"
          else
            echo "inyectada=no" >> "$GITHUB_OUTPUT"
            echo "Ambiente nuevo: la URL se inyecta despues del primer apply"
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="environment=test" -var="aws_region=us-east-2"

      - name: Inyectar URL y re-aplicar (primer despliegue del ambiente)
        if: steps.pre_inject.outputs.inyectada == 'no'
        working-directory: ./terraform
        run: |
          API_URL=$(terraform output -raw api_url)
          echo "URL de la API en TEST: $API_URL"
          sed -i "s|URL_API_PLACEHOLDER|${API_URL}|g" ../frontend/index.html
          terraform apply -auto-approve -var="environment=test" -var="aws_region=us-east-2"

      - name: Verificar que el placeholder fue reemplazado
        run: |
          if grep -q "URL_API_PLACEHOLDER" frontend/index.html; then
            echo "::error::El placeholder no fue reemplazado: el frontend quedaria sin endpoint"
            exit 1
          fi
          echo "Placeholder reemplazado correctamente"

      - name: Resumen del ambiente
        working-directory: ./terraform
        run: |
          {
            echo "### Ambiente TEST desplegado (us-east-2)"
            echo ""
            echo "- **Frontend:** http://$(terraform output -raw website_url)"
            echo "- **API:** $(terraform output -raw api_url)"
            echo "- **Rama:** \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------
  # JOB 3: Despliegue en PRODUCCIÓN (us-east-1)
  # ----------------------------------------------------
  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: sonarcloud_quality_gate
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    outputs:
      website_url: ${{ steps.urls.outputs.website_url }}
      api_url: ${{ steps.urls.outputs.api_url }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Seleccionar workspace PROD
        working-directory: ./terraform
        run: terraform workspace select -or-create prod

      # El sed reemplaza TODA ocurrencia: una segunda dentro de una comparación
      # la dejaría apuntando contra sí misma y rompería el frontend en silencio.
      - name: Validar que el placeholder sea único
        run: |
          OCURRENCIAS=$(grep -o "URL_API_PLACEHOLDER" frontend/index.html | wc -l)
          if [ "$OCURRENCIAS" -ne 1 ]; then
            echo "::error::Se esperaba 1 ocurrencia de URL_API_PLACEHOLDER y hay ${OCURRENCIAS}"
            exit 1
          fi
          echo "Placeholder único: la inyección es segura"

      # Si el ambiente ya existe, la URL se conoce antes de aplicar y basta un
      # solo apply. Solo el primer despliegue necesita aplicar dos veces.
      - name: Inyectar URL de la API (ambiente ya existente)
        id: pre_inject
        working-directory: ./terraform
        run: |
          if API_URL=$(terraform output -raw api_url 2>/dev/null) && [ -n "$API_URL" ]; then
            sed -i "s|URL_API_PLACEHOLDER|${API_URL}|g" ../frontend/index.html
            echo "inyectada=si" >> "$GITHUB_OUTPUT"
            echo "URL conocida, inyectada antes del apply: $API_URL"
          else
            echo "inyectada=no" >> "$GITHUB_OUTPUT"
            echo "Ambiente nuevo: la URL se inyecta despues del primer apply"
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="environment=prod" -var="aws_region=us-east-1"

      - name: Inyectar URL y re-aplicar (primer despliegue del ambiente)
        if: steps.pre_inject.outputs.inyectada == 'no'
        working-directory: ./terraform
        run: |
          API_URL=$(terraform output -raw api_url)
          echo "URL de la API en PROD: $API_URL"
          sed -i "s|URL_API_PLACEHOLDER|${API_URL}|g" ../frontend/index.html
          terraform apply -auto-approve -var="environment=prod" -var="aws_region=us-east-1"

      - name: Verificar que el placeholder fue reemplazado
        run: |
          if grep -q "URL_API_PLACEHOLDER" frontend/index.html; then
            echo "::error::El placeholder no fue reemplazado: el frontend quedaria sin endpoint"
            exit 1
          fi
          echo "Placeholder reemplazado correctamente"

      - name: Capturar URLs
        id: urls
        working-directory: ./terraform
        run: |
          {
            echo "website_url=$(terraform output -raw website_url)"
            echo "api_url=$(terraform output -raw api_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Resumen del ambiente
        working-directory: ./terraform
        run: |
          {
            echo "### Ambiente PRODUCCIÓN desplegado (us-east-1)"
            echo ""
            echo "- **Frontend:** http://$(terraform output -raw website_url)"
            echo "- **API:** $(terraform output -raw api_url)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------
  # JOB 4: Tag + Release (solo tras un PROD exitoso)
  # ----------------------------------------------------
  release:
    name: Crear Tag y Release
    runs-on: ubuntu-latest
    needs: deploy_prod
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular siguiente versión
        id: version
        run: |
          ULTIMO=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$ULTIMO" ]; then
            NUEVA="v1.0.0"
          else
            SEMVER=${ULTIMO#v}
            MAJOR=$(echo "$SEMVER" | cut -d. -f1)
            MINOR=$(echo "$SEMVER" | cut -d. -f2)
            PATCH=$(echo "$SEMVER" | cut -d. -f3)
            NUEVA="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "anterior=${ULTIMO:-ninguno}" >> "$GITHUB_OUTPUT"
          echo "nueva=${NUEVA}" >> "$GITHUB_OUTPUT"
          echo "Versión anterior: ${ULTIMO:-ninguno} -> nueva: ${NUEVA}"

      - name: Crear Tag y Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.nueva }}" \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.nueva }}" \
            --notes "Despliegue automático a PRODUCCIÓN (us-east-1).

          - Frontend: http://${{ needs.deploy_prod.outputs.website_url }}
          - API: ${{ needs.deploy_prod.outputs.api_url }}
          - Commit: ${{ github.sha }}
          - Versión anterior: ${{ steps.version.outputs.anterior }}"

      - name: Resumen del release
        run: |
          {
            echo "### Release ${{ steps.version.outputs.nueva }} publicado"
            echo ""
            echo "- Versión anterior: ${{ steps.version.outputs.anterior }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------
  # JOB 5: PR automático release/** -> master
  # ----------------------------------------------------
  # Solo se abre si el despliegue a TEST salió bien: el PR es la señal de que
  # la release está validada, no de que alguien la empujó.
  abrir_pr_master:
    name: Abrir PR hacia master
    runs-on: ubuntu-latest
    needs: deploy_test
    if: startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Crear el PR si todavía no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"

          # Un PR ya abierto se actualiza solo con cada push a su rama: crear
          # uno nuevo daría error y dejaría el job en rojo sin motivo real.
          EXISTENTE=$(gh pr list --head "$GITHUB_REF_NAME" --base master \
                        --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTENTE" ]; then
            echo "PR #${EXISTENTE} ya está abierto; el push lo actualizó."
            URL=$(gh pr view "$EXISTENTE" --json url --jq .url)
          else
            URL=$(gh pr create --base master --head "$GITHUB_REF_NAME" \
              --title "Release ${VERSION}" \
              --body "Release \`${VERSION}\` validada en TEST (us-east-2).

          **Al mergear este PR se despliega a PRODUCCIÓN** (us-east-1) y el
          pipeline crea el tag y el Release en GitHub. No crees el tag a mano.

          Los checks corrieron en el push a \`${GITHUB_REF_NAME}\`, no acá: un PR
          abierto por \`GITHUB_TOKEN\` no dispara workflows de \`pull_request\`.

          Después del despliegue, el job \`Sincronizar develop\` mergea master de
          vuelta a develop automáticamente.")
            echo "PR creado: ${URL}"
          fi

          {
            echo "### PR hacia master listo"
            echo ""
            echo "- Release: \`${VERSION}\`"
            echo "- PR: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------
  # JOB 6: Back-merge master -> develop
  # ----------------------------------------------------
  # Sin esto develop queda atrás en cuanto el merge a master genera un commit
  # propio (el de merge del PR, o un hotfix nacido de master).
  sincronizar_develop:
    name: Sincronizar develop
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Mergear master en develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          if git merge-base --is-ancestor origin/master HEAD; then
            echo "develop ya contiene todo master: nada que sincronizar"
            echo "- develop ya estaba al día" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Un conflicto acá tiene que romper el job: significa que master y
          # develop divergieron de verdad y eso lo resuelve una persona.
          git merge origin/master -m "Sincroniza develop con master tras el despliegue a producción"

          # Este push NO dispara el pipeline de develop (GITHUB_TOKEN no
          # encadena workflows), así que no repite el despliegue a TEST.
          git push origin develop

          {
            echo "### develop sincronizada con master"
            echo ""
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
